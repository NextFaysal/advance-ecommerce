# =============================================================================
# advance-ecommerce — DOKPLOY stack (prebuilt images, NO local build)
#
# Point Dokploy's Compose service at THIS file. The web/worker images are
# built by GitHub Actions (.github/workflows/build-images.yml) and pushed
# to GHCR — this VPS only pulls and runs them:
#   ghcr.io/nextfaysal/advance-ecommerce-web:latest
#   ghcr.io/nextfaysal/advance-ecommerce-worker:latest
# Images are private: add a GitHub PAT (read:packages) in Dokploy →
# Settings → Registry first, or the pull fails.
#
# The build-from-source variant lives in docker-compose.prod.yml
# (for a machine strong enough to run next build). Everything else —
# services, env, volumes — is identical between the two files.
#
# Fresh-start deploy: set the Environment values in Dokploy → Deploy →
# create the first Owner (DOCKER-DEPLOY.md §3).
# =============================================================================

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advance_ecommerce
      TZ: Asia/Dhaka
    # No published port: web/worker reach Postgres over the compose
    # network (postgres:5432). Publishing 5432 collides with Dokploy's
    # own Postgres on the host and needlessly exposes the DB.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advance_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot schema migration. Uses the worker image (full source +
  # Prisma CLI, no .next needed). Web and worker wait for this to
  # complete successfully before they start.
  migrate:
    image: ghcr.io/nextfaysal/advance-ecommerce-worker:latest
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/advance_ecommerce?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm --filter @advance-ecommerce/db exec prisma migrate deploy --schema=prisma/schema.prisma

  web:
    image: ghcr.io/nextfaysal/advance-ecommerce-web:latest
    pull_policy: always
    restart: unless-stopped
    # Host port FIXED at 3005 (Nazmul's choice, 2026-10-29): host :3000
    # belongs to Dokploy's own dashboard and :5432 to its Postgres, so
    # both collided. Hardcoded on purpose — a ${WEB_PORT} variable in
    # the Dokploy env kept overriding the default back to 3000.
    # The domain also reaches the app via Traefik/dokploy-network.
    ports:
      - "3005:3000"
    networks:
      - default
      - dokploy-network
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/advance_ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (see .env.production.example)}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env (see .env.production.example)}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env (see .env.production.example)}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-bn}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BDT}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Background daemon: BullMQ queues (SMS/email/order jobs), schedulers,
  # automation, call-center. Refuses to start without REDIS_URL — the
  # compose value above points at the redis service.
  worker:
    image: ghcr.io/nextfaysal/advance-ecommerce-worker:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/advance_ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (see .env.production.example)}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set AUTH_ENCRYPTION_KEY in .env (see .env.production.example)}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env (see .env.production.example)}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-bn}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BDT}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  meilidata:

networks:
  # Dokploy's Traefik proxy lives on this external network; without
  # the web service attached to it, domains route to a Bad Gateway
  # even though the app itself is healthy inside its own network.
  dokploy-network:
    external: true
